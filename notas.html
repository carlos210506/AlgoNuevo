<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notas · Para Ana</title><link rel="stylesheet" href="../assets/style.css"></head><body class="inner-body"><div class="page reveal"><div class="intro-head"><div class="eyebrow">Capítulo III · Las notas</div><h1 class="display">Palabras guardadas <em>con cariño.</em></h1><p class="desc">Cinco notas que no necesitan una fecha especial. Puedes abrirlas en el orden que quieras.</p></div><div class="notes-list"><button class="note" type="button" data-note="0"><div class="note-number">01</div><div><h3>Sobre tus colores</h3><p>Un mundo de lila y rosa bebé.</p></div><div class="note-arrow">↗</div></button><button class="note" type="button" data-note="1"><div class="note-number">02</div><div><h3>Sobre la música</h3><p>Una canción puede acompañar un instante.</p></div><div class="note-arrow">↗</div></button><button class="note" type="button" data-note="2"><div class="note-number">03</div><div><h3>Sobre las pequeñas cosas</h3><p>Las cosas bonitas no siempre hacen ruido.</p></div><div class="note-arrow">↗</div></button><button class="note" type="button" data-note="3"><div class="note-number">04</div><div><h3>Sobre lo que viene</h3><p>No hay ningún reloj en este universo.</p></div><div class="note-arrow">↗</div></button><button class="note" type="button" data-note="4"><div class="note-number">05</div><div><h3>Sobre ti, Ana</h3><p>La última nota.</p></div><div class="note-arrow">↗</div></button></div><div class="notes-outro">A veces, lo pequeño dice mucho.</div><div class="closing-band"><h2>Falta una última cosa...</h2><div style="margin-top:23px"><a href="#" data-go="carta" class="solid-btn">Abrir el mensaje final ✧</a></div></div></div><div id="modal" class="modal-overlay" role="dialog" aria-hidden="true" aria-modal="true" aria-label="Un detalle para Ana"><div class="modal"><button class="modal-close" aria-label="Cerrar">×</button><div class="modal-tag">Un pequeño detalle</div><div class="modal-icon">✦</div><h2 class="modal-title"></h2><p class="modal-text"></p></div></div><script src="../assets/page.js"></script><script>const notes=[["Sobre tus colores", "Un mundo de lila y rosa bebé.", "Pensé en los tonos que te gustan para que cada pantalla tenga un poquito de tu estilo: lila suave, rosa bebé y destellos plateados."], ["Sobre la música", "Una canción puede acompañar un instante.", "Pied Piper de BTS tiene su lugar en esta página porque sé que es tu canción favorita. Ojalá este pequeño recorrido tenga una banda sonora tan especial como tus canciones preferidas."], ["Sobre los detalles", "Las cosas bonitas no siempre hacen ruido.", "Un tulipán, un accesorio plateado o una horquilla delicada pueden hacer especial un día cualquiera. Por eso los reuní aquí."], ["Sobre lo que viene", "Un universo con puertas abiertas.", "Que te esperen historias fantásticas, nuevas canciones y experiencias que valga la pena recordar."], ["Sobre ti, Ana", "Una última nota.", "Esta página está hecha con atención a tus gustos y con el deseo de regalarte una sonrisa. Espero que la disfrutes y la sientas un poquito tuya."]];document.querySelectorAll("[data-note]").forEach(b=>b.addEventListener("click",()=>{const x=notes[+b.dataset.note];openAnaModal(x[0],x[2],"✉")}))</script></body></html>
